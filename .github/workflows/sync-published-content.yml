name: Sync published CMS content

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: published-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CMS_PUBLIC_URL: https://north-county-press.onrender.com
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify published-content contracts
        run: node --test tests/article-publishing.test.mjs
      - name: Synchronize published content
        run: npm run sync:articles
      - name: Commit changed snapshot
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- src/data/generated/public-content.v1.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Published snapshot is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/generated/public-content.v1.json
          git commit -m "Sync published CMS content"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Published snapshot committed; the push will trigger the Pages workflow." >> "$GITHUB_STEP_SUMMARY"
